name: Validare

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Instalează dependențele
        run: pip install -r tools/requirements.txt
      - name: Validează schemele și exemplele
        run: python tools/validate.py
